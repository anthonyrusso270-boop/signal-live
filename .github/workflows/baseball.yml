name: MLB odds ledger
on:
  schedule:
    - cron: "7 13,15,17,19,21,23,1,3 * * *"   # every 2h from 9am to 11pm Eastern (UTC-4); no keys needed
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["baseball/snapshot.py", "baseball/grade.py", "baseball/index.html", ".github/workflows/baseball.yml"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  snapshot-grade-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Snapshot the Bovada board
        run: python baseball/snapshot.py
      - name: Grade finished games (MLB Stats API)
        run: python baseball/grade.py
      - name: Commit
        run: |
          git config user.name "signal-live bot"
          git config user.email "actions@users.noreply.github.com"
          git add baseball/odds baseball/results baseball/board.json baseball/ledger.json
          git diff --cached --quiet || git commit -m "mlb: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -q origin main        # the Kalshi bot may have committed meanwhile (different files)
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
